# FXNet — production deployment of the lurker fork.
#
#   cp .env.fxnet.example .env.fxnet   # then fill in the secrets
#   docker compose -f docker-compose.fxnet.yml up -d
#
# This runs our forked image (built + pushed by scripts/release.sh) with the
# network lock active, so every account is bound to irc.fxnet.org. Front it with
# your TLS-terminating reverse proxy at https://chat.fxnet.org — the container
# listens on localhost only.

services:
  lurker:
    image: reg.xfnet.org/fxnet/lurker:latest
    container_name: fxnet-lurker
    ports:
      # Bind to localhost only; the reverse proxy (Caddy/nginx) terminates TLS
      # for chat.fxnet.org and forwards here.
      - '127.0.0.1:8015:8015'
    volumes:
      # All persistent state — SQLite DB, session secret, uploads. Back this up.
      - ./data:/app/data
    env_file:
      # Secrets only: LURKER_PROVISION_SECRET, SESSION_SECRET, LURKER_WEBIRC_PASSWORD.
      # See the example.
      - .env.fxnet
    environment:
      - NODE_ENV=production
      - PORT=8015
      - DATABASE_PATH=/app/data/lurker.db

      # ───── FXNet network lock ────────────────────────────────────────────
      # Bind every account to irc.fxnet.org and hide add/remove-network UI.
      - LURKER_LOCK_NETWORKS=true
      - LURKER_FORCED_NETWORK_NAME=FXNet
      - LURKER_FORCED_NETWORK_HOST=irc.fxnet.org
      - LURKER_FORCED_NETWORK_PORT=6697
      - LURKER_FORCED_NETWORK_TLS=1
      # Comma-separated channels auto-joined for new accounts.
      - LURKER_FORCED_NETWORK_CHANNELS=#chat,#help,#fxnet

      # ───── Public webchat (optional accounts) ────────────────────────────
      # Let visitors join with no account: an ephemeral guest is created, seeded
      # with the forced network, and reaped once idle. Guests can claim a real
      # account later to keep their settings/history.
      - LURKER_PUBLIC_MODE=true
      # Guests idle (no open tab) this many minutes are deleted (default 30).
      - LURKER_GUEST_IDLE_MINUTES=30
      # Max guest creations per client IP per hour (default 5).
      - LURKER_GUEST_RATELIMIT_PER_IP=5
      # When a guest closes their last tab, wait this many seconds before
      # disconnecting them from IRC and removing the guest (default 60). The
      # grace absorbs page refreshes / brief network blips so they don't drop;
      # a reconnect within the window cancels it. 0 = disconnect immediately.
      - LURKER_GUEST_DISCONNECT_GRACE_SECONDS=60

      # ───── WEBIRC real-IP passthrough ────────────────────────────────────
      # Forward each user's real browser IP to the IRCd via WEBIRC, so they are
      # individually attributable/bannable instead of all sharing this gateway's
      # IP. Requires a matching <gateway type="webirc"> block on InspIRCd that
      # trusts this host + LURKER_WEBIRC_PASSWORD (set in .env.fxnet).
      # The gateway name defaults to LURKER_FORCED_NETWORK_NAME; override here.
      - LURKER_WEBIRC_GATEWAY=FXNet
      # Trust the fronting reverse proxy's X-Forwarded-For so req.ip / the WS
      # upgrade resolve the real client IP (the value forwarded over WEBIRC).
      # Set this to the subnet the proxy reaches lurker FROM, as lurker sees it:
      #   - behind a localhost-bound nginx:        loopback
      #   - behind pangolin/Traefik over a docker  172.18.0.0/16  (the bridge
      #     bridge (the FXNet deploy):             gateway, e.g. 172.18.0.1)
      # If this doesn't match the real hop, lurker ignores X-Forwarded-For and
      # forwards the bridge gateway IP (172.18.0.1) instead of the browser IP.
      # NEVER widen this beyond the trusted proxy's hop and NEVER publish
      # lurker's port directly, or clients could spoof X-Forwarded-For.
      - LURKER_TRUST_PROXY=172.18.0.0/16

      # ───── Per-user ident (single-user bans) ─────────────────────────────
      # Locked connections present a stable, unspoofable ident `lu<userId>`,
      # so an oper can ban exactly one lurker user without catching the rest
      # that share this server's IP:
      #     KLINE *!lu<userId>@<lurker-host>      (or a channel ban)
      # The user id is shown in lurker's admin user list. With identd enabled
      # below (and the IRCd configured to query it on port 113), the ident is
      # reported authoritatively (no leading ~); without it the IRCd records
      # ~lu<userId>, which is still unique and bannable.
      # - LURKER_IDENTD_ENABLED=true
      # - LURKER_IDENTD_PORT=113

      # ───── Passkeys + secure cookies for chat.fxnet.org ──────────────────
      - WEBAUTHN_RP_ID=chat.fxnet.org
      - WEBAUTHN_RP_NAME=FXNet Chat
      - WEBAUTHN_ORIGIN=https://chat.fxnet.org
      - COOKIE_SECURE=true
    restart: unless-stopped
