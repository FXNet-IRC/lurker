version: 2

# Supply-chain hardening notes:
#   * cooldown — don't surface a new version until it has been public long
#     enough for a malicious or yanked release to be caught. The 2025 npm
#     compromises (chalk/debug phishing, the Shai-Hulud worm) were live for
#     only hours before being pulled, so even a few days of cooldown sidesteps
#     them. Security updates ignore cooldown, so real CVEs still come through.
#   * groups — collapse low-risk minor/patch bumps into a single PR per npm
#     ecosystem (one lockfile rebase instead of N conflicting ones); major
#     bumps still arrive as individual PRs so they each get a manual look.
#     NOTE: the npm groups intentionally use `update-types` with NO `patterns`
#     selector. Adding `patterns: ['*']` would mark every matched dependency
#     "handled" and can silently suppress its major-version PR entirely
#     (dependabot-core#14202); update-types alone leaves majors as individual
#     PRs, per the docs. The github-actions group has no update-types limit, so
#     it bundles ALL action updates (majors included) — those are few and
#     low-risk, and grouping them avoids that suppression edge case entirely.
updates:
  # Server (root) npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Client (vue_client) npm dependencies
  - package-ecosystem: npm
    directory: /vue_client
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Docs site (vitepress + wrangler)
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'

  # Docker base image. REQUIRED, not optional: the Dockerfile pins
  # node:24-slim by digest for supply-chain reasons, which also freezes the
  # Debian package set inside it. Without dependabot rewriting that digest the
  # base image silently rots and stops receiving OS security patches — the pin
  # would trade one risk for a worse one.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Digest refreshes only — never a tag bump. Left unconstrained, this
    # ecosystem chases the highest numeric tag, which for `node` means the
    # non-LTS line: its first run proposed node 25 (#729), a release that
    # reached end-of-life on 2026-06-01. Moving between Node majors also has
    # to bump node-version in test.yml/docs.yml in lockstep, so it is a
    # deliberate change that must never arrive as an automated one-file diff.
    # semver-patch is deliberately NOT ignored: the tag (`24-slim`) carries no
    # patch component, so it cannot produce a tag bump, and leaving it alone
    # keeps any risk of suppressing the digest updates this entry exists for.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
